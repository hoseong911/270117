<!DOCTYPE html>
<html lang="ko" data-layout="v">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>호성❤️유진, 결혼합니다!</title>
  <meta property="og:title" content="호성❤️유진, 결혼합니다!">
  <meta property="og:description" content="호성❤️유진, 결혼합니다!">
  <meta property="og:image" content="https://raw.githubusercontent.com/hoseong911/270117/main/images/01.jpg">
  <meta property="og:type" content="website">
  <!-- PWA: 홈 화면 추가 시 전체화면 앱으로 실행 -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="270117">
  <meta name="theme-color" content="#f6f7f8">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-h.css">
  <link rel="stylesheet" href="style-v.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Dancing+Script:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Great+Vibes&family=Alex+Brush&family=Nanum+Myeongjo&family=Nanum+Pen+Script&family=Pinyon+Script&family=Sacramento&family=Cinzel+Decorative&family=Allura&family=Nanum+Brush+Script&family=Parisienne&family=Tangerine:wght@400;700&family=Satisfy&family=Petit+Formal+Script&family=Cinzel:wght@400;700&family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Noto+Serif+KR:wght@300;400&family=Black+Han+Sans&family=Sunflower:wght@300;500;700&family=Song+Myung&family=Hahmlet:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
</head>
<body>

<div id="loadingScreen"></div>
<div id="whiteWash"></div>

<!-- 배경음악 (bgm.mp3 를 레포에 올리면 재생) -->
<audio id="bgm" src="https://raw.githubusercontent.com/hoseong911/270117/main/bgm.mp3" loop preload="auto"></audio>
<button id="bgmBtn" aria-label="배경음악 켜기/끄기"><i></i><i></i><i></i></button>

<nav id="mainNav">
  <div id="navBar">
    <button id="menuBtn" aria-label="메뉴">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div id="menuDrawer">
    <div id="navInner"></div>
  </div>
</nav>

<div id="hDeck"></div>

<footer id="mainFooter" style="display:none">2027. 01. 17</footer>

<div id="toast"></div>

<div id="galleryModal">
  <button class="modal-close" id="modalClose">✕</button>
  <button class="modal-prev" id="modalPrev">‹</button>
  <img id="galleryImg" src="" alt="">
  <button class="modal-next" id="modalNext">›</button>
</div>

<!-- 참석여부 모달 -->
<div id="rsvpModal" class="wedding-modal">
  <div class="wedding-modal-box">
    <button class="wedding-modal-close" id="rsvpModalClose">✕</button>
    <div class="wedding-modal-title">참 석 여 부</div>
    <form class="rsvp-form" id="rsvpForm">
      <div class="rsvp-field">
        <div class="rsvp-label">이 름</div>
        <input class="rsvp-input" id="rsvpName" placeholder="성함을 입력해주세요" maxlength="20">
      </div>
      <div class="rsvp-field">
        <div class="rsvp-label">참 석 여 부</div>
        <div class="rsvp-radio-row">
          <label class="rsvp-radio-opt selected" id="rsvpAttYes">
            <input type="radio" name="attendance" value="참석" checked> 참석
          </label>
          <label class="rsvp-radio-opt" id="rsvpAttNo">
            <input type="radio" name="attendance" value="불참"> 불참
          </label>
        </div>
      </div>
      <div class="rsvp-field" id="rsvpCountField">
        <div class="rsvp-label">인 원 수</div>
        <div class="rsvp-count-row">
          <button type="button" class="rsvp-count-btn" id="rsvpCountDn">−</button>
          <span class="rsvp-count-val" id="rsvpCountVal">1</span>
          <button type="button" class="rsvp-count-btn" id="rsvpCountUp">+</button>
        </div>
      </div>
      <button type="submit" class="rsvp-submit" id="rsvpSubmit">참석 의사 전달하기</button>
    </form>
  </div>
</div>

<!-- 방명록 모달 -->
<div id="gbModal" class="wedding-modal">
  <div class="wedding-modal-box">
    <button class="wedding-modal-close" id="gbModalClose">✕</button>
    <div class="wedding-modal-title">방 명 록</div>
    <div style="display:flex;flex-direction:column;gap:.8rem;">
      <input class="rsvp-input" id="gbName" placeholder="이름" maxlength="20">
      <textarea class="rsvp-input rsvp-textarea" id="gbMsg"
        placeholder="축하 메시지를 남겨주세요 (최대 140자)" rows="4" maxlength="140"
        style="resize:vertical"></textarea>
      <button class="gb-submit" id="gbSubmit">방명록 남기기</button>
    </div>
  </div>
</div>

<!-- 하객 사진 업로드 모달 -->
<div id="phModal" class="wedding-modal">
  <div class="wedding-modal-box">
    <button class="wedding-modal-close" id="phModalClose">✕</button>
    <div class="wedding-modal-title">사 진 올 리 기</div>
    <div style="display:flex;flex-direction:column;gap:.8rem;">
      <input class="rsvp-input" id="phName" placeholder="이름 (선택)" maxlength="20">
      <input type="file" id="phFile" accept="image/*" multiple style="display:none">
      <label class="ph-pick-btn" for="phFile">사진 선택 (최대 10장)</label>
      <div class="ph-preview" id="phPreview"></div>
      <button class="gb-submit" id="phSubmit">올리기</button>
    </div>
  </div>
</div>

<!-- 오시는 길: 교통 상세 안내 모달 -->
<div id="transportModal" class="wedding-modal">
  <div class="wedding-modal-box">
    <button class="wedding-modal-close" id="transportModalClose">✕</button>
    <div class="wedding-modal-title">상세 안내</div>
    <div class="transport-detail" id="transportBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
